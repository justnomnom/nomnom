<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <style type="text/tailwindcss">
      @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-accent-foreground: var(--accent-foreground);
        --color-destructive: var(--destructive);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-popover: var(--popover);
        --color-popover-foreground: var(--popover-foreground);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --color-chart-1: var(--chart-1);
        --color-chart-2: var(--chart-2);
        --color-chart-3: var(--chart-3);
        --color-chart-4: var(--chart-4);
        --color-chart-5: var(--chart-5);

        --font-font-sans: var(--font-sans);
        --font-font-heading: var(--font-heading);
        --font-font-serif: var(--font-serif);
        --font-font-mono: var(--font-mono);

        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);
      }

      :root {
          --background: #FFFFFF;
        --foreground: #0F172A;
        --primary: #ff6b35;
        --primary-foreground: #FFFFFF;
        --secondary: #F1F5F9;
        --secondary-foreground: #0F172A;
        --muted: #F8FAFC;
        --muted-foreground: #64748B;
        --accent: #F1F5F9;
        --accent-foreground: #0F172A;
        --destructive: #EF4444;
        --card: #FFFFFF;
        --card-foreground: #0F172A;
        --popover: #FFFFFF;
        --popover-foreground: #0F172A;
        --border: #E2E8F0;
        --input: #F1F5F9;
        --ring: #FF5A5F;
        --chart-1: #FF5A5F;
        --chart-2: #3B82F6;
        --chart-3: #10B981;
        --chart-4: #F59E0B;
        --chart-5: #8B5CF6;

        --font-sans: "Plus Jakarta Sans";
        --font-heading: "Plus Jakarta Sans";
        --font-serif: "Playfair Display";
        --font-mono: "JetBrains Mono";

        --radius: 1rem;
      }

      /* Prevent layout shift for icons without explicit dimensions */
      iconify-icon:not([width]):not([height]) {
        display: inline-block;
        width: 1em;
        height: 1em;
      }

      /* Hide scrollbars */
      *,
      *::before,
      *::after {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      *::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="min-h-screen bg-background text-foreground pb-12 font-sans">
      <header
        class="px-6 pt-12 pb-6 flex items-center justify-between sticky top-0 bg-background/90 backdrop-blur-lg z-40"
      >
        <button
          class="w-10 h-10 rounded-full flex items-center justify-center bg-secondary text-foreground active:scale-95 transition-all"
        >
          <iconify-icon icon="solar:alt-arrow-left-linear" width="24" height="24"></iconify-icon>
        </button>
        <h1 class="font-heading font-bold text-lg tracking-tight">Settings</h1>
        <div class="w-10"></div>
      </header>
      <main class="px-6 space-y-8">
        <section class="space-y-4">
          <h2 class="text-xs font-bold uppercase tracking-wider text-muted-foreground px-1">
            Account
          </h2>
          <div class="bg-secondary/50 rounded-3xl overflow-hidden">
            <button
              class="w-full flex items-center justify-between p-4 bg-transparent hover:bg-secondary transition-colors group"
            >
              <div class="flex items-center gap-3">
                <div
                  class="w-10 h-10 rounded-xl bg-background flex items-center justify-center text-primary shadow-sm"
                >
                  <iconify-icon icon="solar:user-linear" width="20" height="20"></iconify-icon>
                </div>
                <span class="font-bold text-sm">Personal Information</span>
              </div>
              <iconify-icon
                icon="solar:alt-arrow-right-linear"
                width="20"
                height="20"
                class="text-muted-foreground group-hover:translate-x-1 transition-transform"
              ></iconify-icon>
            </button>
            <div class="h-px bg-border/50 mx-4"></div>
            <button
              class="w-full flex items-center justify-between p-4 bg-transparent hover:bg-secondary transition-colors group"
            >
              <div class="flex items-center gap-3">
                <div
                  class="w-10 h-10 rounded-xl bg-background flex items-center justify-center text-primary shadow-sm"
                >
                  <iconify-icon icon="solar:bell-linear" width="20" height="20"></iconify-icon>
                </div>
                <span class="font-bold text-sm">Notifications</span>
              </div>
              <iconify-icon
                icon="solar:alt-arrow-right-linear"
                width="20"
                height="20"
                class="text-muted-foreground group-hover:translate-x-1 transition-transform"
              ></iconify-icon>
            </button>
            <div class="h-px bg-border/50 mx-4"></div>
            <button
              class="w-full flex items-center justify-between p-4 bg-transparent hover:bg-secondary transition-colors group"
            >
              <div class="flex items-center gap-3">
                <div
                  class="w-10 h-10 rounded-xl bg-background flex items-center justify-center text-primary shadow-sm"
                >
                  <iconify-icon
                    icon="solar:shield-keyhole-linear"
                    width="20"
                    height="20"
                  ></iconify-icon>
                </div>
                <span class="font-bold text-sm">Privacy &amp; Security</span>
              </div>
              <iconify-icon
                icon="solar:alt-arrow-right-linear"
                width="20"
                height="20"
                class="text-muted-foreground group-hover:translate-x-1 transition-transform"
              ></iconify-icon>
            </button>
          </div>
        </section>
        <section class="space-y-4">
          <h2 class="text-xs font-bold uppercase tracking-wider text-muted-foreground px-1">
            Content
          </h2>
          <div class="bg-secondary/50 rounded-3xl overflow-hidden">
            <button
              class="w-full flex items-center justify-between p-4 bg-transparent hover:bg-secondary transition-colors group"
            >
              <div class="flex items-center gap-3">
                <div
                  class="w-10 h-10 rounded-xl bg-background flex items-center justify-center text-primary shadow-sm"
                >
                  <iconify-icon
                    icon="solar:clapperboard-edit-linear"
                    width="20"
                    height="20"
                  ></iconify-icon>
                </div>
                <span class="font-bold text-sm">Manage Mentions</span>
              </div>
              <iconify-icon
                icon="solar:alt-arrow-right-linear"
                width="20"
                height="20"
                class="text-muted-foreground group-hover:translate-x-1 transition-transform"
              ></iconify-icon>
            </button>
            <div class="h-px bg-border/50 mx-4"></div>
            <button
              class="w-full flex items-center justify-between p-4 bg-transparent hover:bg-secondary transition-colors group"
            >
              <div class="flex items-center gap-3">
                <div
                  class="w-10 h-10 rounded-xl bg-background flex items-center justify-center text-primary shadow-sm"
                >
                  <iconify-icon
                    icon="solar:cloud-download-linear"
                    width="20"
                    height="20"
                  ></iconify-icon>
                </div>
                <span class="font-bold text-sm">Import History</span>
              </div>
              <iconify-icon
                icon="solar:alt-arrow-right-linear"
                width="20"
                height="20"
                class="text-muted-foreground group-hover:translate-x-1 transition-transform"
              ></iconify-icon>
            </button>
          </div>
        </section>
        <section class="space-y-4">
          <h2 class="text-xs font-bold uppercase tracking-wider text-muted-foreground px-1">
            Support
          </h2>
          <div class="bg-secondary/50 rounded-3xl overflow-hidden">
            <button
              class="w-full flex items-center justify-between p-4 bg-transparent hover:bg-secondary transition-colors group"
            >
              <div class="flex items-center gap-3">
                <div
                  class="w-10 h-10 rounded-xl bg-background flex items-center justify-center text-primary shadow-sm"
                >
                  <iconify-icon
                    icon="material-symbols:help-outline-rounded"
                    width="20"
                    height="20"
                  ></iconify-icon>
                </div>
                <span class="font-bold text-sm">Help Center</span>
              </div>
              <iconify-icon
                icon="solar:alt-arrow-right-linear"
                width="20"
                height="20"
                class="text-muted-foreground group-hover:translate-x-1 transition-transform"
              ></iconify-icon>
            </button>
            <div class="h-px bg-border/50 mx-4"></div>
            <button
              class="w-full flex items-center justify-between p-4 bg-transparent hover:bg-secondary transition-colors group"
            >
              <div class="flex items-center gap-3">
                <div
                  class="w-10 h-10 rounded-xl bg-background flex items-center justify-center text-primary shadow-sm"
                >
                  <iconify-icon
                    icon="solar:info-circle-linear"
                    width="20"
                    height="20"
                  ></iconify-icon>
                </div>
                <span class="font-bold text-sm">About NomNom</span>
              </div>
              <iconify-icon
                icon="solar:alt-arrow-right-linear"
                width="20"
                height="20"
                class="text-muted-foreground group-hover:translate-x-1 transition-transform"
              ></iconify-icon>
            </button>
          </div>
        </section>
        <section class="pt-4">
          <button
            class="w-full flex items-center justify-between p-4 bg-destructive/10 rounded-3xl group transition-all active:scale-[0.98]"
          >
            <div class="flex items-center gap-3">
              <div
                class="w-10 h-10 rounded-xl bg-white/50 flex items-center justify-center text-destructive"
              >
                <iconify-icon icon="solar:logout-linear" width="20" height="20"></iconify-icon>
              </div>
              <span class="font-bold text-sm text-destructive">Log Out</span>
            </div>
          </button>
          <p
            class="text-center text-[10px] text-muted-foreground mt-8 font-medium tracking-widest uppercase"
          >
            Version 1.2.4 (Build 402)
          </p>
        </section>
      </main>
    </div>
  </body>
</html>
