<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SaveToList</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <style type="text/tailwindcss">
      @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-accent-foreground: var(--accent-foreground);
        --color-destructive: var(--destructive);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-popover: var(--popover);
        --color-popover-foreground: var(--popover-foreground);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --color-chart-1: var(--chart-1);
        --color-chart-2: var(--chart-2);
        --color-chart-3: var(--chart-3);
        --color-chart-4: var(--chart-4);
        --color-chart-5: var(--chart-5);

        --font-font-sans: var(--font-sans);
        --font-font-heading: var(--font-heading);
        --font-font-serif: var(--font-serif);
        --font-font-mono: var(--font-mono);

        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);
      }

      :root {
          --background: #FFFFFF;
        --foreground: #0F172A;
        --primary: #ff6b35;
        --primary-foreground: #FFFFFF;
        --secondary: #F1F5F9;
        --secondary-foreground: #0F172A;
        --muted: #F8FAFC;
        --muted-foreground: #64748B;
        --accent: #F1F5F9;
        --accent-foreground: #0F172A;
        --destructive: #EF4444;
        --card: #FFFFFF;
        --card-foreground: #0F172A;
        --popover: #FFFFFF;
        --popover-foreground: #0F172A;
        --border: #E2E8F0;
        --input: #F1F5F9;
        --ring: #FF5A5F;
        --chart-1: #FF5A5F;
        --chart-2: #3B82F6;
        --chart-3: #10B981;
        --chart-4: #F59E0B;
        --chart-5: #8B5CF6;

        --font-sans: "Plus Jakarta Sans";
        --font-heading: "Plus Jakarta Sans";
        --font-serif: "Playfair Display";
        --font-mono: "JetBrains Mono";

        --radius: 1rem;
      }

      /* Prevent layout shift for icons without explicit dimensions */
      iconify-icon:not([width]):not([height]) {
        display: inline-block;
        width: 1em;
        height: 1em;
      }

      /* Hide scrollbars */
      *,
      *::before,
      *::after {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      *::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="min-h-screen bg-background text-foreground flex items-end font-sans">
      <div
        class="w-full bg-background rounded-t-[2.5rem] p-8 shadow-2xl relative border-t border-border"
      >
        <div class="w-12 h-1.5 bg-border rounded-full mx-auto mb-8"></div>
        <div class="flex items-center justify-between mb-8">
          <h2 class="font-heading font-bold text-2xl tracking-tight">Save to...</h2>
          <button class="text-muted-foreground p-2">
            <iconify-icon icon="solar:close-circle-bold" width="24"></iconify-icon>
          </button>
        </div>
        <div class="space-y-4 max-h-[45vh] overflow-y-auto hide-scrollbar">
          <button
            class="w-full flex items-center gap-4 p-4 rounded-3xl bg-rose-50 border border-rose-100 group transition-all active:scale-[0.98]"
          >
            <div
              class="w-12 h-12 rounded-2xl bg-rose-500 text-white flex items-center justify-center shadow-lg shadow-rose-500/20 transition-transform"
            >
              <iconify-icon icon="solar:heart-bold" width="24"></iconify-icon>
            </div>
            <div class="flex-1 text-left">
              <p class="font-bold text-base text-rose-900 leading-none mb-1">Favorites</p>
              <p class="text-xs text-rose-700/70 font-medium">Your absolute top picks</p>
            </div>
            <div
              class="w-6 h-6 rounded-full border-2 border-rose-200 flex items-center justify-center"
            >
              <iconify-icon
                icon="solar:check-circle-bold"
                class="text-rose-500"
                width="24"
              ></iconify-icon>
            </div>
          </button>
          <div class="pt-4 pb-2 px-1">
            <p class="text-[10px] font-bold uppercase tracking-[0.1em] text-muted-foreground">
              My Nom Nom Lists
            </p>
          </div>
          <button
            class="w-full flex items-center gap-4 p-4 rounded-3xl bg-card border border-border hover:border-primary/30 transition-all active:scale-[0.98]"
          >
            <div class="w-12 h-12 rounded-2xl overflow-hidden bg-muted">
              <img
                src="https://ggrhecslgdflloszjkwl.supabase.co/storage/v1/object/public/user-assets/6GZq4ggf385/components/dkVDGEZOGcK.png"
                class="w-full h-full object-cover"
              />
            </div>
            <div class="flex-1 text-left">
              <p class="font-bold text-base text-foreground leading-none mb-1 text-nowrap">
                LA's Best Matcha
              </p>
              <p class="text-xs text-muted-foreground font-medium">8 restaurants · Public</p>
            </div></button
          ><button
            class="w-full flex items-center gap-4 p-4 rounded-3xl bg-card border border-border hover:border-primary/30 transition-all active:scale-[0.98]"
          >
            <div class="w-12 h-12 rounded-2xl overflow-hidden bg-muted">
              <img
                src="https://ggrhecslgdflloszjkwl.supabase.co/storage/v1/object/public/user-assets/6GZq4ggf385/components/0PMfN1DYFah.png"
                class="w-full h-full object-cover"
              />
            </div>
            <div class="flex-1 text-left">
              <p class="font-bold text-base text-foreground leading-none mb-1 text-nowrap">
                Date Night Spots
              </p>
              <p class="text-xs text-muted-foreground font-medium">5 restaurants · Private</p>
            </div></button
          ><button
            class="w-full flex items-center gap-4 p-4 rounded-3xl border-2 border-dashed border-border text-muted-foreground hover:text-primary hover:border-primary/50 transition-all active:scale-[0.98]"
          >
            <div class="w-12 h-12 rounded-2xl bg-secondary flex items-center justify-center">
              <iconify-icon icon="material-symbols:add-rounded" width="24"></iconify-icon>
            </div>
            <p class="font-bold text-base">New Nom Nom List</p>
          </button>
        </div>
        <div class="mt-8 space-y-4">
          <div>
            <p
              class="text-[10px] font-bold uppercase tracking-[0.1em] text-muted-foreground mb-3 px-1"
            >
              Personal Note
            </p>
            <textarea
              placeholder="Why is this a must-go for you?"
              class="w-full bg-muted/30 border border-border rounded-[2rem] p-5 text-sm focus:ring-2 focus:ring-primary/20 outline-none min-h-[100px] resize-none transition-all focus:bg-background"
            ></textarea>
          </div>
          <button
            class="w-full bg-primary text-primary-foreground font-bold py-4.5 rounded-[2rem] shadow-xl shadow-primary/20 active:scale-[0.98] transition-all text-lg"
          >
            Confirm Selection
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
