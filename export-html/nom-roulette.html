<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NomRoulette</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <style type="text/tailwindcss">
      @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-accent-foreground: var(--accent-foreground);
        --color-destructive: var(--destructive);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-popover: var(--popover);
        --color-popover-foreground: var(--popover-foreground);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --color-chart-1: var(--chart-1);
        --color-chart-2: var(--chart-2);
        --color-chart-3: var(--chart-3);
        --color-chart-4: var(--chart-4);
        --color-chart-5: var(--chart-5);

        --font-font-sans: var(--font-sans);
        --font-font-heading: var(--font-heading);
        --font-font-serif: var(--font-serif);
        --font-font-mono: var(--font-mono);

        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);
      }

      :root {
          --background: #FFFFFF;
        --foreground: #0F172A;
        --primary: #ff6b35;
        --primary-foreground: #FFFFFF;
        --secondary: #F1F5F9;
        --secondary-foreground: #0F172A;
        --muted: #F8FAFC;
        --muted-foreground: #64748B;
        --accent: #F1F5F9;
        --accent-foreground: #0F172A;
        --destructive: #EF4444;
        --card: #FFFFFF;
        --card-foreground: #0F172A;
        --popover: #FFFFFF;
        --popover-foreground: #0F172A;
        --border: #E2E8F0;
        --input: #F1F5F9;
        --ring: #FF5A5F;
        --chart-1: #FF5A5F;
        --chart-2: #3B82F6;
        --chart-3: #10B981;
        --chart-4: #F59E0B;
        --chart-5: #8B5CF6;

        --font-sans: "Plus Jakarta Sans";
        --font-heading: "Plus Jakarta Sans";
        --font-serif: "Playfair Display";
        --font-mono: "JetBrains Mono";

        --radius: 1rem;
      }

      /* Prevent layout shift for icons without explicit dimensions */
      iconify-icon:not([width]):not([height]) {
        display: inline-block;
        width: 1em;
        height: 1em;
      }

      /* Hide scrollbars */
      *,
      *::before,
      *::after {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      *::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <div
      class="min-h-screen bg-primary flex flex-col items-center justify-center p-8 relative overflow-hidden"
    >
      <div class="absolute inset-0 opacity-10 pointer-events-none">
        <div class="absolute top-10 left-10 rotate-12">
          <iconify-icon icon="fluent-emoji:hamburger" width="80"></iconify-icon>
        </div>
        <div class="absolute bottom-20 right-10 -rotate-12">
          <iconify-icon icon="fluent-emoji:pizza" width="80"></iconify-icon>
        </div>
        <div class="absolute top-1/2 left-20 rotate-45">
          <iconify-icon icon="fluent-emoji:taco" width="60"></iconify-icon>
        </div>
        <div class="absolute top-40 right-20 -rotate-45">
          <iconify-icon icon="fluent-emoji:sushi" width="70"></iconify-icon>
        </div>
      </div>
      <button
        class="absolute top-12 left-6 size-12 bg-white/20 backdrop-blur-md rounded-full flex items-center justify-center text-white active:scale-90 transition-transform"
        onclick="history.back()"
      >
        <iconify-icon icon="solar:close-circle-bold" width="24"></iconify-icon>
      </button>
      <div class="flex-1 flex flex-col items-center justify-center w-full max-w-sm text-center">
        <div class="relative mb-12">
          <div
            class="size-48 bg-white rounded-[3.5rem] flex items-center justify-center shadow-2xl animate-[spin_4s_linear_infinite] p-10"
          >
            <iconify-icon icon="mdi:dice-5" class="text-primary text-8xl"></iconify-icon>
          </div>
          <div
            class="absolute -top-4 -right-4 size-16 bg-foreground text-background rounded-full flex items-center justify-center shadow-xl animate-bounce"
          >
            <iconify-icon icon="solar:stars-bold" width="32"></iconify-icon>
          </div>
        </div>
        <h1
          class="text-6xl font-black font-heading text-white tracking-tighter mb-4 leading-none italic animate-pulse"
        >
          Nom Nom Roulette!
        </h1>
        <p class="text-white/80 text-xl font-medium leading-tight mb-12 italic px-4">
          Shake for a random hit of deliciousness. No thinking, just
          <span class="font-black text-white">Nom Nomming!</span>
        </p>
        <button
          class="w-full bg-white text-primary py-6 rounded-[2.5rem] font-black text-2xl shadow-2xl active:scale-95 transition-all hover:scale-105"
          onclick="location.href=&#39;#Roulette Result&#39;"
        >
          Spin the Noms!
        </button>
        <p
          class="mt-8 text-white/70 font-black uppercase tracking-[0.2em] text-[10px] animate-pulse"
        >
          From your Nom Nom Circle
        </p>
      </div>
    </div>
  </body>
</html>
