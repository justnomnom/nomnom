<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ManageContent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <style type="text/tailwindcss">
      @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-accent-foreground: var(--accent-foreground);
        --color-destructive: var(--destructive);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-popover: var(--popover);
        --color-popover-foreground: var(--popover-foreground);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --color-chart-1: var(--chart-1);
        --color-chart-2: var(--chart-2);
        --color-chart-3: var(--chart-3);
        --color-chart-4: var(--chart-4);
        --color-chart-5: var(--chart-5);

        --font-font-sans: var(--font-sans);
        --font-font-heading: var(--font-heading);
        --font-font-serif: var(--font-serif);
        --font-font-mono: var(--font-mono);

        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);
      }

      :root {
          --background: #FFFFFF;
        --foreground: #0F172A;
        --primary: #ff6b35;
        --primary-foreground: #FFFFFF;
        --secondary: #F1F5F9;
        --secondary-foreground: #0F172A;
        --muted: #F8FAFC;
        --muted-foreground: #64748B;
        --accent: #F1F5F9;
        --accent-foreground: #0F172A;
        --destructive: #EF4444;
        --card: #FFFFFF;
        --card-foreground: #0F172A;
        --popover: #FFFFFF;
        --popover-foreground: #0F172A;
        --border: #E2E8F0;
        --input: #F1F5F9;
        --ring: #FF5A5F;
        --chart-1: #FF5A5F;
        --chart-2: #3B82F6;
        --chart-3: #10B981;
        --chart-4: #F59E0B;
        --chart-5: #8B5CF6;

        --font-sans: "Plus Jakarta Sans";
        --font-heading: "Plus Jakarta Sans";
        --font-serif: "Playfair Display";
        --font-mono: "JetBrains Mono";

        --radius: 1rem;
      }

      /* Prevent layout shift for icons without explicit dimensions */
      iconify-icon:not([width]):not([height]) {
        display: inline-block;
        width: 1em;
        height: 1em;
      }

      /* Hide scrollbars */
      *,
      *::before,
      *::after {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      *::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="min-h-screen bg-background text-foreground pb-24 font-sans">
      <header
        class="px-6 pt-12 pb-6 flex items-center justify-between sticky top-0 bg-background/90 backdrop-blur-lg z-40"
      >
        <button
          class="w-10 h-10 rounded-full flex items-center justify-center bg-secondary text-foreground active:scale-95 transition-all"
        >
          <iconify-icon icon="solar:alt-arrow-left-linear" width="24" height="24"></iconify-icon>
        </button>
        <h1 class="font-heading font-bold text-lg tracking-tight">Manage Content</h1>
        <button
          class="w-10 h-10 rounded-full flex items-center justify-center bg-primary text-primary-foreground shadow-lg shadow-primary/20 active:scale-95 transition-all"
        >
          <iconify-icon icon="material-symbols:add-rounded" width="24" height="24"></iconify-icon>
        </button>
      </header>
      <main class="px-6 space-y-6">
        <div class="flex items-center gap-2 bg-secondary/50 p-1.5 rounded-2xl">
          <button
            class="flex-1 bg-background text-foreground py-2.5 rounded-xl text-xs font-bold shadow-sm"
          >
            Mentions (84)</button
          ><button class="flex-1 text-muted-foreground py-2.5 rounded-xl text-xs font-bold">
            My Lists (12)
          </button>
        </div>
        <div
          class="bg-primary/5 border border-primary/20 rounded-3xl p-5 flex items-center justify-between group cursor-pointer active:scale-[0.98] transition-all"
        >
          <div class="flex items-center gap-4">
            <div class="bg-primary text-white p-2.5 rounded-2xl shadow-md">
              <iconify-icon icon="solar:bookmark-square-bold" width="24"></iconify-icon>
            </div>
            <div>
              <p class="text-sm font-bold text-foreground">New Nom Nom List</p>
              <p class="text-[11px] text-muted-foreground">
                Curate a custom Nom Nom list for your circle
              </p>
            </div>
          </div>
          <iconify-icon
            icon="solar:alt-arrow-right-linear"
            class="text-primary"
            width="20"
          ></iconify-icon>
        </div>
        <section class="space-y-4">
          <div class="flex items-center justify-between px-1">
            <h2 class="font-heading font-bold text-base">Recent Mentions</h2>
            <button class="text-xs font-bold text-primary">Filter</button>
          </div>
          <div
            class="group relative bg-card border border-border rounded-3xl overflow-hidden p-3 flex gap-4 transition-all hover:border-primary/50"
          >
            <div class="w-24 h-24 rounded-2xl overflow-hidden shrink-0">
              <img
                src="https://ggrhecslgdflloszjkwl.supabase.co/storage/v1/object/public/user-assets/6GZq4ggf385/components/wOkD9ZaNqLc.png"
                alt="Restaurant"
                class="w-full h-full object-cover"
              />
            </div>
            <div class="flex flex-1 flex-col justify-between py-1">
              <div>
                <div class="flex justify-between items-start">
                  <h3 class="font-bold text-sm leading-tight pr-8">Lumina Cafe &amp; Roastery</h3>
                  <div class="absolute top-3 right-3">
                    <button
                      class="p-2 rounded-xl bg-primary text-white shadow-sm ring-4 ring-background"
                    >
                      <iconify-icon icon="solar:star-bold" width="16" height="16"></iconify-icon>
                    </button>
                  </div>
                </div>
                <p class="text-[10px] text-muted-foreground mt-1 flex items-center gap-1">
                  <iconify-icon icon="hugeicons:instagram" class="text-primary"></iconify-icon>
                  Featured Reel • 2 days ago
                </p>
              </div>
              <div class="flex items-center gap-3">
                <span
                  class="px-2 py-0.5 rounded-md bg-secondary text-[9px] font-bold uppercase tracking-wider"
                  >Brunch</span
                ><span class="text-[10px] text-muted-foreground flex items-center gap-1"
                  ><iconify-icon icon="solar:eye-linear"></iconify-icon> 1.2k views</span
                >
              </div>
            </div>
          </div>
          <div
            class="group relative bg-card border border-border rounded-3xl overflow-hidden p-3 flex gap-4 transition-all hover:border-primary/50"
          >
            <div class="w-24 h-24 rounded-2xl overflow-hidden shrink-0">
              <img
                src="https://ggrhecslgdflloszjkwl.supabase.co/storage/v1/object/public/user-assets/6GZq4ggf385/components/EWpU3Z1DWjn.png"
                alt="Restaurant"
                class="w-full h-full object-cover"
              />
            </div>
            <div class="flex flex-1 flex-col justify-between py-1">
              <div>
                <div class="flex justify-between items-start">
                  <h3 class="font-bold text-sm leading-tight pr-8">Petit Bakery</h3>
                </div>
                <p class="text-[10px] text-muted-foreground mt-1 flex items-center gap-1">
                  <iconify-icon icon="hugeicons:camera-01" class="text-primary"></iconify-icon>
                  Story Mention • 1 week ago
                </p>
              </div>
              <div class="flex items-center gap-3">
                <span
                  class="px-2 py-0.5 rounded-md bg-secondary text-[9px] font-bold uppercase tracking-wider"
                  >Bakery</span
                ><span class="text-[10px] text-muted-foreground flex items-center gap-1"
                  ><iconify-icon icon="solar:eye-linear"></iconify-icon> 842 views</span
                >
              </div>
            </div>
          </div>
        </section>
      </main>
      <div class="fixed bottom-6 left-6 right-6 z-50">
        <button
          class="w-full bg-foreground text-background font-bold py-4 rounded-2xl shadow-2xl flex items-center justify-center gap-2 active:scale-[0.98] transition-all"
        >
          <iconify-icon icon="solar:cloud-upload-bold" width="20" height="20"></iconify-icon>Import
          from Instagram
        </button>
      </div>
    </div>
  </body>
</html>
