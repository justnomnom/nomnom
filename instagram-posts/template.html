<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    background: #FF6B35;
    font-family: 'Arial Black', 'Arial Bold', Arial, sans-serif;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 60px 70px 50px;
  }

  .top-section {
    width: 100%;
    text-align: left;
    flex-shrink: 0;
  }

  .title {
    font-size: 68px;
    font-weight: 900;
    line-height: 1.05;
    text-transform: uppercase;
    letter-spacing: -1px;
    color: #FFFFFF;
    text-shadow: 2px 3px 10px rgba(0,0,0,0.25);
    margin-bottom: 20px;
  }

  .subtitle {
    font-size: 26px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.88);
    text-shadow: 1px 2px 6px rgba(0,0,0,0.2);
  }

  .hero-image-container {
    width: 940px;
    height: 460px;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 16px 60px rgba(0,0,0,0.35), 0 6px 20px rgba(0,0,0,0.2);
    flex-shrink: 0;
    margin: 30px 0;
  }

  .hero-image-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .bottom-bar {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-shrink: 0;
  }

  .brand-block {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .wordmark {
    font-size: 36px;
    font-weight: 900;
    letter-spacing: 1px;
    color: #FFFFFF;
    text-transform: uppercase;
  }

  .tagline {
    font-size: 15px;
    font-weight: 400;
    color: rgba(255,255,255,0.75);
    text-transform: lowercase;
    letter-spacing: 0.5px;
  }

  .source-block {
    text-align: right;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .news-source {
    font-size: 18px;
    font-weight: 700;
    color: rgba(255,255,255,0.85);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .news-date {
    font-size: 16px;
    font-weight: 400;
    color: rgba(255,255,255,0.65);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div class="top-section">
    <div class="title">{{TITLE}}</div>
    <div class="subtitle">{{SUBTITLE}}</div>
  </div>

  <div class="hero-image-container">
    <img src="{{IMAGE_URL}}" alt="food" />
  </div>

  <div class="bottom-bar">
    <div class="brand-block">
      <div class="wordmark">NomNom</div>
      <div class="tagline">restaurant picks from people you trust</div>
    </div>
    <div class="source-block">
      <div class="news-source">{{NEWS_SOURCE}}</div>
      <div class="news-date">{{NEWS_DATE}}</div>
    </div>
  </div>
</body>
</html>
