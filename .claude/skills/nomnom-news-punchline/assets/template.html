<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Tokens from DESIGN.md + remotion/src/theme.js. Hex only because this file is headless HTML. */
:root {
  --paper: #faf9f5;       /* marketing.paper */
  --ink: #15130f;         /* grey[900] / text.primary */
  --ink2: #6e6657;        /* grey[600] / text.secondary */
  --ink3: #948c7c;        /* grey[500] */
  --terra: #FF6B35;       /* primary.main — ~10% of the surface */
  --divider: #e8e6dc;     /* marketing.dividerWarm */
  --hairline: #d1cfc5;    /* marketing.hairline */
  --sans: 'Albert Sans', system-ui, sans-serif;
  --serif: 'Libre Baskerville', Georgia, serif;
  --shadow: 0 10px 26px -8px rgba(21, 19, 15, 0.22); /* grey[900] shadow, never #000 */
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  width: 1080px;
  height: 1080px;
  overflow: hidden;
  background: var(--paper);
}

.card {
  width: 1080px;
  height: 1080px;
  background: var(--paper);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 64px 64px 48px;
  position: relative;
}

/* Terracotta is the accent, not the fill (DESIGN.md §2: ~10% of any surface). */
.card::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 10px;
  background: var(--terra);
}

.top { width: 100%; }

.quote {
  font-family: var(--serif);
  font-size: 64px;
  font-weight: 700;
  color: var(--ink);
  line-height: 1.2;
  letter-spacing: -0.02em;
  margin-bottom: 24px;
}

.subtitle {
  font-family: var(--sans);
  font-size: 28px;
  font-weight: 500;
  color: var(--ink2);
  line-height: 1.35;
}

.hero {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  padding: 32px 0;
}

.hero img {
  max-height: 420px;
  max-width: 952px;
  width: 100%;
  object-fit: cover;
  border-radius: 32px; /* card radius — DESIGN.md §4 */
  box-shadow: var(--shadow);
}

.bottom {
  width: 100%;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  border-top: 1px solid var(--divider);
  padding-top: 24px;
}

.brand-name {
  font-family: var(--sans);
  font-size: 28px;
  font-weight: 800; /* cap; Albert Sans is not loaded at 900 */
  color: var(--terra);
  letter-spacing: -0.015em;
  line-height: 1.25;
}

.brand-tagline {
  font-family: var(--sans);
  font-size: 16px;
  font-weight: 400;
  color: var(--ink3);
  margin-top: 8px;
  line-height: 1.5;
}

.source-block { text-align: right; }

.news-source {
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink2);
  line-height: 1.5;
}

.news-date {
  font-family: var(--sans);
  font-size: 14px;
  font-weight: 400;
  color: var(--ink3);
  margin-top: 8px;
  line-height: 1.5;
}
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="quote">{{TITLE}}</div>
    <div class="subtitle">{{SUBTITLE}}</div>
  </div>
  <div class="hero">
    <img src="{{IMAGE_URL}}" alt="">
  </div>
  <div class="bottom">
    <div>
      <div class="brand-name">NomNom</div>
      <div class="brand-tagline">{{TAGLINE}}</div>
    </div>
    <div class="source-block">
      <div class="news-source">{{NEWS_SOURCE}}</div>
      <div class="news-date">{{NEWS_DATE}}</div>
    </div>
  </div>
</div>
</body>
</html>
