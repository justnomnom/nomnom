<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MapView</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <style type="text/tailwindcss">
      @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-accent-foreground: var(--accent-foreground);
        --color-destructive: var(--destructive);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-popover: var(--popover);
        --color-popover-foreground: var(--popover-foreground);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --color-chart-1: var(--chart-1);
        --color-chart-2: var(--chart-2);
        --color-chart-3: var(--chart-3);
        --color-chart-4: var(--chart-4);
        --color-chart-5: var(--chart-5);

        --font-font-sans: var(--font-sans);
        --font-font-heading: var(--font-heading);
        --font-font-serif: var(--font-serif);
        --font-font-mono: var(--font-mono);

        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);
      }

      :root {
          --background: #FFFFFF;
        --foreground: #0F172A;
        --primary: #ff6b35;
        --primary-foreground: #FFFFFF;
        --secondary: #F1F5F9;
        --secondary-foreground: #0F172A;
        --muted: #F8FAFC;
        --muted-foreground: #64748B;
        --accent: #F1F5F9;
        --accent-foreground: #0F172A;
        --destructive: #EF4444;
        --card: #FFFFFF;
        --card-foreground: #0F172A;
        --popover: #FFFFFF;
        --popover-foreground: #0F172A;
        --border: #E2E8F0;
        --input: #F1F5F9;
        --ring: #FF5A5F;
        --chart-1: #FF5A5F;
        --chart-2: #3B82F6;
        --chart-3: #10B981;
        --chart-4: #F59E0B;
        --chart-5: #8B5CF6;

        --font-sans: "Plus Jakarta Sans";
        --font-heading: "Plus Jakarta Sans";
        --font-serif: "Playfair Display";
        --font-mono: "JetBrains Mono";

        --radius: 1rem;
      }

      /* Prevent layout shift for icons without explicit dimensions */
      iconify-icon:not([width]):not([height]) {
        display: inline-block;
        width: 1em;
        height: 1em;
      }

      /* Hide scrollbars */
      *,
      *::before,
      *::after {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      *::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="h-screen w-full relative overflow-hidden bg-slate-100 font-sans">
      <img
        src="https://ggrhecslgdflloszjkwl.supabase.co/storage/v1/object/public/user-assets/6GZq4ggf385/components/LtTDdxxChw3.png"
        class="absolute inset-0 w-full h-full object-cover"
      /><button
        class="fixed bottom-32 right-6 z-[60] size-14 bg-foreground text-background rounded-full shadow-2xl flex items-center justify-center border-4 border-background active:scale-90 transition-transform"
        onclick="location.href=&#39;#RouletteScreen&#39;"
      >
        <iconify-icon icon="mdi:dice-5" class="text-xl"></iconify-icon>
      </button>
      <div class="absolute inset-0 pointer-events-none">
        <div class="absolute top-1/4 left-1/3 pointer-events-auto">
          <div class="relative group cursor-pointer scale-110">
            <div
              class="bg-primary text-white p-2.5 rounded-2xl rounded-bl-none shadow-xl border-2 border-white flex items-center justify-center transform -rotate-12 transition-transform active:scale-95 relative overflow-visible"
            >
              <iconify-icon icon="solar:cup-hot-bold" width="20" height="20"></iconify-icon>
              <div
                class="absolute -top-3 -right-3 bg-white rounded-full size-6 flex items-center justify-center shadow-lg border-2 border-primary"
              >
                <iconify-icon
                  icon="solar:fire-bold"
                  class="text-primary text-xs animate-bounce"
                ></iconify-icon>
              </div>
            </div>
          </div>
        </div>
        <div class="absolute top-1/2 left-2/3 pointer-events-auto">
          <div
            class="bg-white text-foreground p-2.5 rounded-2xl rounded-bl-none shadow-xl border-2 border-white flex items-center justify-center transform transition-transform active:scale-95"
          >
            <iconify-icon
              icon="solar:hamburger-menu-bold"
              class="text-muted-foreground"
              width="20"
              height="20"
            ></iconify-icon>
          </div>
        </div>
        <div class="absolute top-1/3 right-1/4 pointer-events-auto">
          <div
            class="bg-white text-foreground p-2.5 rounded-2xl rounded-bl-none shadow-xl border-2 border-white flex items-center justify-center transform transition-transform active:scale-95"
          >
            <iconify-icon
              icon="solar:wineglass-triangle-bold"
              class="text-muted-foreground"
              width="20"
              height="20"
            ></iconify-icon>
          </div>
        </div>
        <div class="absolute top-[60%] left-[45%]">
          <div class="relative flex items-center justify-center">
            <div class="absolute w-12 h-12 bg-blue-500/20 rounded-full animate-ping"></div>
            <div class="w-5 h-5 bg-blue-500 rounded-full border-2 border-white shadow-lg"></div>
          </div>
        </div>
      </div>
      <div class="absolute top-12 left-0 right-0 px-4 z-40">
        <div class="flex items-center gap-3">
          <div class="flex-1 relative">
            <iconify-icon
              icon="solar:magnifer-linear"
              class="absolute left-4 top-1/2 -translate-y-1/2 text-muted-foreground"
              width="20"
              height="20"
            ></iconify-icon
            ><input
              type="text"
              class="w-full bg-white/95 backdrop-blur-lg rounded-2xl py-4 pl-12 pr-4 text-sm font-semibold shadow-xl border border-white/20 focus:outline-none"
              placeholder="Search areas, cuisines..."
            />
          </div>
          <button
            class="bg-white/95 backdrop-blur-lg p-4 rounded-2xl shadow-xl border border-white/20 text-foreground transition-all active:scale-90"
          >
            <iconify-icon icon="solar:tuning-linear" width="20" height="20"></iconify-icon>
          </button>
        </div>
        <div
          style="scrollbar-width: none;"
          class="flex gap-2.5 mt-4 overflow-x-auto hide-scrollbar"
        >
          <button
            class="whitespace-nowrap bg-primary text-white px-5 py-2.5 rounded-xl text-xs font-black shadow-lg border border-primary flex items-center gap-2"
          >
            <iconify-icon icon="solar:fire-bold" width="16" height="16"></iconify-icon>Hot Nom Noms</button
          ><button
            class="whitespace-nowrap bg-white/95 backdrop-blur-lg px-5 py-2.5 rounded-xl text-xs font-bold shadow-lg border border-white/20 flex items-center gap-2"
          >
            <iconify-icon icon="solar:star-linear" width="16" height="16"></iconify-icon>High Rated</button
          ><button
            class="whitespace-nowrap bg-white/95 backdrop-blur-lg px-5 py-2.5 rounded-xl text-xs font-bold shadow-lg border border-white/20 flex items-center gap-2"
          >
            <iconify-icon
              icon="solar:users-group-two-rounded-linear"
              width="16"
              height="16"
            ></iconify-icon
            >Following
          </button>
        </div>
      </div>
      <div class="absolute bottom-20 left-0 right-0 z-40 px-4">
        <div
          class="bg-white/95 backdrop-blur-xl rounded-[2.5rem] p-5 shadow-2xl border border-white/20 flex flex-col gap-4 translate-y-2"
        >
          <div class="w-12 h-1.5 bg-border/40 rounded-full self-center -mt-1 mb-1"></div>
          <div class="flex items-center gap-2 px-1">
            <div class="h-1 flex-1 bg-muted rounded-full overflow-hidden flex">
              <div class="h-full bg-primary animate-pulse" style="width: 88%"></div>
            </div>
            <span
              class="text-[9px] font-black uppercase tracking-widest text-primary flex items-center gap-1"
              ><iconify-icon icon="solar:fire-bold"></iconify-icon> Sizzling Hot</span
            >
          </div>
          <div class="flex gap-4">
            <div class="w-24 h-24 rounded-[2rem] overflow-hidden shrink-0 shadow-md">
              <img
                src="https://ggrhecslgdflloszjkwl.supabase.co/storage/v1/object/public/user-assets/6GZq4ggf385/components/wOkD9ZaNqLc.png"
                class="w-full h-full object-cover"
              />
            </div>
            <div class="flex-1 min-w-0 py-0.5">
              <div class="flex justify-between items-start">
                <h3 class="font-heading font-extrabold text-xl truncate pr-2 tracking-tight">
                  Lumina Cafe
                </h3>
                <span
                  class="bg-primary/10 text-primary text-xs font-bold px-2 py-1 rounded-lg flex items-center gap-1 shrink-0"
                  ><iconify-icon icon="solar:star-bold"></iconify-icon> 4.8</span
                >
              </div>
              <p class="text-xs font-bold text-muted-foreground uppercase tracking-widest mt-0.5">
                Modern Cafe • $$
              </p>
              <div class="flex items-center gap-2 mt-2.5">
                <div class="flex -space-x-1.5">
                  <img
                    src="https://randomuser.me/api/portraits/women/44.jpg"
                    class="w-6 h-6 rounded-full border-2 border-white shadow-sm"
                  /><img
                    src="https://randomuser.me/api/portraits/men/32.jpg"
                    class="w-6 h-6 rounded-full border-2 border-white shadow-sm"
                  />
                </div>
                <span class="text-[10px] font-bold text-muted-foreground leading-none"
                  >@emma_eats + 2 others</span
                >
              </div>
            </div>
          </div>
          <div class="flex gap-3 mt-1">
            <button
              class="flex-1 bg-primary text-primary-foreground font-black py-4 rounded-2xl flex items-center justify-center gap-2 shadow-lg shadow-primary/20 active:scale-95 transition-all"
              onclick="location.href=&#39;#DBT17i88oFY&#39;"
            >
              <iconify-icon icon="solar:routing-2-bold" width="20" height="20"></iconify-icon>Open
              in Maps</button
            ><button
              class="bg-secondary text-secondary-foreground font-bold px-5 py-4 rounded-2xl active:scale-95 transition-all"
            >
              <iconify-icon icon="solar:bookmark-linear" width="24" height="24"></iconify-icon>
            </button>
          </div>
        </div>
      </div>
      <nav
        class="fixed bottom-0 left-0 w-full bg-background/95 backdrop-blur-xl border-t border-border px-6 py-3 flex items-center justify-between z-50 safe-area-bottom"
      >
        <button
          class="flex flex-col items-center gap-1 text-muted-foreground hover:text-foreground w-16 transition-colors"
          onclick="location.href=&#39;#N1Q2qxG9BHO&#39;"
        >
          <iconify-icon icon="solar:compass-linear" width="24" height="24"></iconify-icon
          ><span class="text-[10px] font-medium tracking-wide">Discover</span></button
        ><button class="flex flex-col items-center gap-1 text-primary w-16 group">
          <iconify-icon icon="solar:map-bold" width="24" height="24"></iconify-icon
          ><span class="text-[10px] font-bold tracking-wide">Map</span></button
        ><button
          class="flex flex-col items-center gap-1 text-muted-foreground hover:text-foreground w-16 transition-colors"
          onclick="location.href=&#39;#dlxPwjvXOsT&#39;"
        >
          <iconify-icon icon="solar:bookmark-linear" width="24" height="24"></iconify-icon
          ><span class="text-[10px] font-medium tracking-wide">Saved</span></button
        ><button
          class="flex flex-col items-center gap-1 text-muted-foreground hover:text-foreground w-16 transition-colors"
          onclick="location.href=&#39;#UP3QVIzvHzc&#39;"
        >
          <iconify-icon icon="solar:user-circle-linear" width="24" height="24"></iconify-icon
          ><span class="text-[10px] font-medium tracking-wide">Profile</span>
        </button>
      </nav>
    </div>
  </body>
</html>
