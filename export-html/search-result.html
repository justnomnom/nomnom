<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SearchResult</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <style type="text/tailwindcss">
      @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-accent-foreground: var(--accent-foreground);
        --color-destructive: var(--destructive);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-popover: var(--popover);
        --color-popover-foreground: var(--popover-foreground);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --color-chart-1: var(--chart-1);
        --color-chart-2: var(--chart-2);
        --color-chart-3: var(--chart-3);
        --color-chart-4: var(--chart-4);
        --color-chart-5: var(--chart-5);

        --font-font-sans: var(--font-sans);
        --font-font-heading: var(--font-heading);
        --font-font-serif: var(--font-serif);
        --font-font-mono: var(--font-mono);

        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);
      }

      :root {
          --background: #FFFFFF;
        --foreground: #0F172A;
        --primary: #ff6b35;
        --primary-foreground: #FFFFFF;
        --secondary: #F1F5F9;
        --secondary-foreground: #0F172A;
        --muted: #F8FAFC;
        --muted-foreground: #64748B;
        --accent: #F1F5F9;
        --accent-foreground: #0F172A;
        --destructive: #EF4444;
        --card: #FFFFFF;
        --card-foreground: #0F172A;
        --popover: #FFFFFF;
        --popover-foreground: #0F172A;
        --border: #E2E8F0;
        --input: #F1F5F9;
        --ring: #FF5A5F;
        --chart-1: #FF5A5F;
        --chart-2: #3B82F6;
        --chart-3: #10B981;
        --chart-4: #F59E0B;
        --chart-5: #8B5CF6;

        --font-sans: "Plus Jakarta Sans";
        --font-heading: "Plus Jakarta Sans";
        --font-serif: "Playfair Display";
        --font-mono: "JetBrains Mono";

        --radius: 1rem;
      }

      /* Prevent layout shift for icons without explicit dimensions */
      iconify-icon:not([width]):not([height]) {
        display: inline-block;
        width: 1em;
        height: 1em;
      }

      /* Hide scrollbars */
      *,
      *::before,
      *::after {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      *::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="min-h-screen bg-background text-foreground pb-24 font-sans">
      <header
        class="px-6 pt-12 pb-6 sticky top-0 bg-background/95 backdrop-blur-xl z-40 border-b border-border flex items-center gap-4"
      >
        <button
          class="bg-secondary p-2.5 rounded-full text-foreground active:scale-90 transition-all"
          onclick="history.back()"
        >
          <iconify-icon icon="solar:alt-arrow-left-linear" width="20"></iconify-icon>
        </button>
        <div class="flex-1 relative group">
          <iconify-icon
            icon="solar:magnifer-linear"
            class="absolute left-4 top-1/2 -translate-y-1/2 text-primary transition-colors"
            width="18"
          ></iconify-icon
          ><input
            type="text"
            value="Date Night"
            class="w-full bg-secondary border-none rounded-xl pl-10 pr-4 py-2.5 text-sm font-bold focus:ring-2 focus:ring-primary outline-none"
          />
        </div>
        <button
          class="bg-secondary p-2.5 rounded-xl text-foreground flex items-center justify-center"
        >
          <iconify-icon icon="solar:tuning-bold" width="18"></iconify-icon>
        </button>
      </header>
      <main class="px-4 pt-6 space-y-6">
        <div class="flex items-center justify-between">
          <h2 class="text-sm font-black uppercase tracking-widest text-muted-foreground italic">
            24 Nom Noms found
          </h2>
          <div
            class="flex items-center gap-1.5 bg-primary/10 text-primary px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest"
          >
            <iconify-icon icon="solar:fire-bold"></iconify-icon>Trending
          </div>
        </div>
        <div class="grid grid-cols-1 gap-6">
          <article
            class="bg-card rounded-3xl border border-border overflow-hidden shadow-sm"
            onclick="location.href=&#39;#DBT17i88oFY&#39;"
          >
            <div class="relative aspect-video">
              <img
                src="https://ggrhecslgdflloszjkwl.supabase.co/storage/v1/object/public/user-assets/6GZq4ggf385/components/PLHoh8fYa03.png"
                class="w-full h-full object-cover"
              />
              <div class="absolute top-3 right-3">
                <button
                  class="bg-black/20 backdrop-blur-md p-2 rounded-full text-white border border-white/10"
                >
                  <iconify-icon icon="solar:bookmark-linear" width="18"></iconify-icon>
                </button>
              </div>
              <div class="absolute bottom-3 left-3 flex gap-1.5">
                <span
                  class="bg-white/90 backdrop-blur-md text-foreground px-2 py-1 rounded-lg text-[9px] font-black uppercase tracking-widest flex items-center gap-1"
                  ><iconify-icon icon="solar:heart-bold" class="text-rose-500"></iconify-icon> Date
                  Night</span
                >
              </div>
            </div>
            <div class="p-4">
              <div class="flex justify-between items-start mb-2">
                <div>
                  <h3 class="font-bold text-base">Al Dente House</h3>
                  <p class="text-xs text-muted-foreground font-medium">Italian • Arts District</p>
                </div>
                <div
                  class="flex items-center gap-1 bg-primary/5 px-2 py-1 rounded-lg text-primary text-[11px] font-bold"
                >
                  <iconify-icon icon="solar:star-bold"></iconify-icon> 4.9
                </div>
              </div>
              <div class="flex items-center gap-2 pt-2 border-t border-border/50">
                <div class="flex -space-x-2">
                  <img
                    src="https://randomuser.me/api/portraits/women/12.jpg"
                    class="size-6 rounded-full border border-background"
                  /><img
                    src="https://randomuser.me/api/portraits/men/32.jpg"
                    class="size-6 rounded-full border border-background"
                  />
                </div>
                <p class="text-[10px] text-muted-foreground font-bold italic">
                  Top pick for your circle
                </p>
              </div>
            </div>
          </article>
          <article class="bg-card rounded-3xl border border-border overflow-hidden shadow-sm">
            <div class="relative aspect-video">
              <img
                src="https://ggrhecslgdflloszjkwl.supabase.co/storage/v1/object/public/user-assets/6GZq4ggf385/components/wOkD9ZaNqLc.png"
                class="w-full h-full object-cover"
              />
              <div class="absolute top-3 right-3">
                <button
                  class="bg-black/20 backdrop-blur-md p-2 rounded-full text-white border border-white/10"
                >
                  <iconify-icon icon="solar:bookmark-linear" width="18"></iconify-icon>
                </button>
              </div>
              <div class="absolute bottom-3 left-3 flex gap-1.5">
                <span
                  class="bg-white/90 backdrop-blur-md text-foreground px-2 py-1 rounded-lg text-[9px] font-black uppercase tracking-widest flex items-center gap-1"
                  ><iconify-icon icon="solar:heart-bold" class="text-rose-500"></iconify-icon>
                  Romantic</span
                >
              </div>
            </div>
            <div class="p-4">
              <div class="flex justify-between items-start mb-2">
                <div>
                  <h3 class="font-bold text-base">Lumina Cafe</h3>
                  <p class="text-xs text-muted-foreground font-medium">Modern • Silver Lake</p>
                </div>
                <div
                  class="flex items-center gap-1 bg-primary/5 px-2 py-1 rounded-lg text-primary text-[11px] font-bold"
                >
                  <iconify-icon icon="solar:star-bold"></iconify-icon> 4.8
                </div>
              </div>
              <div class="flex items-center gap-2 pt-2 border-t border-border/50">
                <div class="flex -space-x-2">
                  <img
                    src="https://randomuser.me/api/portraits/women/44.jpg"
                    class="size-6 rounded-full border border-background"
                  />
                </div>
                <p class="text-[10px] text-muted-foreground font-bold italic">
                  @emma_eats secret gem
                </p>
              </div>
            </div>
          </article>
        </div>
      </main>
    </div>
  </body>
</html>
