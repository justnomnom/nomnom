<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RouletteResult</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <style type="text/tailwindcss">
      @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-accent-foreground: var(--accent-foreground);
        --color-destructive: var(--destructive);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-popover: var(--popover);
        --color-popover-foreground: var(--popover-foreground);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --color-chart-1: var(--chart-1);
        --color-chart-2: var(--chart-2);
        --color-chart-3: var(--chart-3);
        --color-chart-4: var(--chart-4);
        --color-chart-5: var(--chart-5);

        --font-font-sans: var(--font-sans);
        --font-font-heading: var(--font-heading);
        --font-font-serif: var(--font-serif);
        --font-font-mono: var(--font-mono);

        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);
      }

      :root {
          --background: #FFFFFF;
        --foreground: #0F172A;
        --primary: #ff6b35;
        --primary-foreground: #FFFFFF;
        --secondary: #F1F5F9;
        --secondary-foreground: #0F172A;
        --muted: #F8FAFC;
        --muted-foreground: #64748B;
        --accent: #F1F5F9;
        --accent-foreground: #0F172A;
        --destructive: #EF4444;
        --card: #FFFFFF;
        --card-foreground: #0F172A;
        --popover: #FFFFFF;
        --popover-foreground: #0F172A;
        --border: #E2E8F0;
        --input: #F1F5F9;
        --ring: #FF5A5F;
        --chart-1: #FF5A5F;
        --chart-2: #3B82F6;
        --chart-3: #10B981;
        --chart-4: #F59E0B;
        --chart-5: #8B5CF6;

        --font-sans: "Plus Jakarta Sans";
        --font-heading: "Plus Jakarta Sans";
        --font-serif: "Playfair Display";
        --font-mono: "JetBrains Mono";

        --radius: 1rem;
      }

      /* Prevent layout shift for icons without explicit dimensions */
      iconify-icon:not([width]):not([height]) {
        display: inline-block;
        width: 1em;
        height: 1em;
      }

      /* Hide scrollbars */
      *,
      *::before,
      *::after {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      *::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <div
      class="min-h-screen bg-background flex flex-col items-center justify-center p-6 relative overflow-hidden"
    >
      <div class="absolute inset-0 pointer-events-none">
        <div class="absolute top-20 left-10 animate-bounce duration-1000">
          <iconify-icon
            icon="fluent-emoji:sparkles"
            width="40"
            class="text-primary opacity-40"
          ></iconify-icon>
        </div>
        <div class="absolute bottom-40 right-10 animate-pulse duration-700">
          <iconify-icon
            icon="fluent-emoji:fire"
            width="40"
            class="text-primary opacity-40"
          ></iconify-icon>
        </div>
        <div class="absolute top-1/3 right-5 -rotate-12">
          <iconify-icon
            icon="fluent-emoji:party-popper"
            width="60"
            class="text-primary opacity-20"
          ></iconify-icon>
        </div>
      </div>
      <div class="w-full max-w-sm flex flex-col items-center">
        <div class="mb-6 flex flex-col items-center gap-2">
          <span
            class="bg-primary/10 text-primary text-[10px] font-black uppercase tracking-[0.2em] px-3 py-1.5 rounded-full italic animate-pulse"
            >The Winning Nom Nom!</span
          >
          <h1
            class="text-4xl font-black font-heading text-foreground tracking-tighter italic uppercase text-center leading-none"
          >
            Lumina Cafe
          </h1>
        </div>
        <div class="w-full relative group mb-8">
          <div
            class="absolute inset-0 bg-primary/20 blur-2xl rounded-[3rem] -z-10 animate-pulse"
          ></div>
          <div
            class="bg-card rounded-[3rem] overflow-hidden border border-border shadow-2xl relative"
          >
            <div class="aspect-[4/5] relative">
              <img
                src="https://ggrhecslgdflloszjkwl.supabase.co/storage/v1/object/public/user-assets/6GZq4ggf385/components/FiPbVitLagN.png"
                class="w-full h-full object-cover"
              />
              <div
                class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent"
              ></div>
              <div class="absolute bottom-6 left-6 right-6">
                <div class="bg-white/10 backdrop-blur-md p-4 rounded-2xl border border-white/20">
                  <div class="flex justify-between items-center mb-2">
                    <span
                      class="text-[10px] font-black text-white uppercase tracking-widest italic flex items-center gap-1.5"
                      ><iconify-icon icon="solar:fire-bold" class="text-primary"></iconify-icon>Nom
                      Nom Meter</span
                    ><span class="text-[10px] font-black text-white">92%</span>
                  </div>
                  <div class="h-1.5 w-full bg-white/20 rounded-full overflow-hidden">
                    <div
                      class="h-full bg-primary shadow-[0_0_8px_rgba(255,107,53,0.8)]"
                      style="width: 92%"
                    ></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="flex items-center gap-3 mb-10">
          <div class="flex -space-x-3">
            <img
              src="https://randomuser.me/api/portraits/women/12.jpg"
              class="size-10 rounded-full border-2 border-background shadow-md"
            /><img
              src="https://randomuser.me/api/portraits/men/32.jpg"
              class="size-10 rounded-full border-2 border-background shadow-md"
            />
            <div
              class="size-10 rounded-full bg-primary/10 border-2 border-background flex items-center justify-center text-[10px] font-black text-primary shadow-md italic"
            >
              +8
            </div>
          </div>
          <div class="flex flex-col">
            <p class="text-[11px] font-black text-foreground uppercase tracking-tighter">
              Your Nom Nom Circle
            </p>
            <p class="text-[9px] text-muted-foreground font-bold tracking-tight italic">
              Recommended by @emma_eats and others
            </p>
          </div>
        </div>
        <div class="flex flex-col gap-3 w-full">
          <button
            class="w-full bg-primary text-primary-foreground py-5 rounded-2xl font-black text-lg shadow-xl shadow-primary/30 flex items-center justify-center gap-2 active:scale-95 transition-all"
            onclick="location.href=&#39;#DBT17i88oFY&#39;"
          >
            <iconify-icon icon="solar:shop-2-bold" width="20"></iconify-icon
            ><span class="uppercase tracking-widest italic">View Nom Nom Details</span>
          </button>
          <div class="grid grid-cols-2 gap-3 w-full">
            <button
              class="bg-secondary text-secondary-foreground py-4 rounded-2xl font-black text-xs uppercase tracking-widest flex items-center justify-center gap-2 active:scale-95 transition-all"
            >
              <iconify-icon icon="solar:map-point-bold" width="16"></iconify-icon>Open Maps</button
            ><button
              class="bg-background border border-border text-foreground py-4 rounded-2xl font-black text-xs uppercase tracking-widest flex items-center justify-center gap-2 active:scale-95 transition-all"
              onclick="location.href=&#39;#4igOmvQeWWl&#39;"
            >
              <iconify-icon icon="solar:refresh-bold" width="16"></iconify-icon>Spin Again
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
