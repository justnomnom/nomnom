<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EditMention</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <style type="text/tailwindcss">
      @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-accent-foreground: var(--accent-foreground);
        --color-destructive: var(--destructive);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-popover: var(--popover);
        --color-popover-foreground: var(--popover-foreground);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --color-chart-1: var(--chart-1);
        --color-chart-2: var(--chart-2);
        --color-chart-3: var(--chart-3);
        --color-chart-4: var(--chart-4);
        --color-chart-5: var(--chart-5);

        --font-font-sans: var(--font-sans);
        --font-font-heading: var(--font-heading);
        --font-font-serif: var(--font-serif);
        --font-font-mono: var(--font-mono);

        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);
      }

      :root {
          --background: #FFFFFF;
        --foreground: #0F172A;
        --primary: #ff6b35;
        --primary-foreground: #FFFFFF;
        --secondary: #F1F5F9;
        --secondary-foreground: #0F172A;
        --muted: #F8FAFC;
        --muted-foreground: #64748B;
        --accent: #F1F5F9;
        --accent-foreground: #0F172A;
        --destructive: #EF4444;
        --card: #FFFFFF;
        --card-foreground: #0F172A;
        --popover: #FFFFFF;
        --popover-foreground: #0F172A;
        --border: #E2E8F0;
        --input: #F1F5F9;
        --ring: #FF5A5F;
        --chart-1: #FF5A5F;
        --chart-2: #3B82F6;
        --chart-3: #10B981;
        --chart-4: #F59E0B;
        --chart-5: #8B5CF6;

        --font-sans: "Plus Jakarta Sans";
        --font-heading: "Plus Jakarta Sans";
        --font-serif: "Playfair Display";
        --font-mono: "JetBrains Mono";

        --radius: 1rem;
      }

      /* Prevent layout shift for icons without explicit dimensions */
      iconify-icon:not([width]):not([height]) {
        display: inline-block;
        width: 1em;
        height: 1em;
      }

      /* Hide scrollbars */
      *,
      *::before,
      *::after {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      *::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="min-h-screen bg-background text-foreground pb-12 font-sans">
      <header
        class="px-6 pt-12 pb-6 flex items-center justify-between sticky top-0 bg-background/90 backdrop-blur-lg z-40"
      >
        <button
          class="text-sm font-semibold text-muted-foreground hover:text-foreground transition-colors"
        >
          Cancel
        </button>
        <h1 class="font-heading font-bold text-lg tracking-tight">Edit Mention</h1>
        <button class="text-sm font-bold text-primary hover:opacity-80 transition-opacity">
          Save
        </button>
      </header>
      <main class="px-6 space-y-8">
        <section class="space-y-3">
          <label class="text-xs font-bold uppercase tracking-wider text-muted-foreground px-1"
            >Display Media</label
          >
          <div class="relative aspect-[16/10] rounded-3xl overflow-hidden group">
            <img
              src="https://ggrhecslgdflloszjkwl.supabase.co/storage/v1/object/public/user-assets/6GZq4ggf385/components/wOkD9ZaNqLc.png"
              alt="Current Media"
              class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
            />
            <div
              class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity"
            >
              <button
                class="bg-white text-black px-6 py-2.5 rounded-2xl font-bold text-sm shadow-xl active:scale-95 transition-all"
              >
                Change Photo
              </button>
            </div>
          </div>
        </section>
        <section class="space-y-6">
          <div class="space-y-2">
            <label class="text-xs font-bold uppercase tracking-wider text-muted-foreground px-1"
              >Restaurant Name</label
            >
            <div class="relative flex items-center bg-secondary rounded-2xl p-4">
              <iconify-icon
                icon="solar:shop-2-bold"
                class="text-muted-foreground mr-3"
                width="20"
              ></iconify-icon
              ><input
                type="text"
                value="Lumina Cafe &amp; Roastery"
                class="flex-1 bg-transparent border-none p-0 text-sm font-medium focus:ring-0 outline-none"
              /><iconify-icon
                icon="solar:alt-arrow-right-linear"
                class="text-muted-foreground"
                width="18"
              ></iconify-icon>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div class="space-y-2">
              <label class="text-xs font-bold uppercase tracking-wider text-muted-foreground px-1"
                >Source Label</label
              ><select
                class="w-full bg-secondary border-none rounded-2xl px-5 py-4 text-sm font-medium focus:ring-2 focus:ring-primary outline-none appearance-none"
              >
                <option selected>Featured Reel</option>
                <option>Story Mention</option>
                <option>Feed Post</option>
                <option>TikTok Video</option>
                <option>YouTube Short</option>
              </select>
            </div>
            <div class="space-y-2">
              <label class="text-xs font-bold uppercase tracking-wider text-muted-foreground px-1"
                >Category</label
              ><select
                class="w-full bg-secondary border-none rounded-2xl px-5 py-4 text-sm font-medium focus:ring-2 focus:ring-primary outline-none appearance-none"
              >
                <option selected>Brunch</option>
                <option>Dinner</option>
                <option>Bakery</option>
                <option>Drinks</option>
                <option>Hidden Gem</option>
              </select>
            </div>
          </div>
          <div class="space-y-2">
            <label class="text-xs font-bold uppercase tracking-wider text-muted-foreground px-1"
              >Source Link (URL)</label
            >
            <div class="relative flex items-center bg-secondary rounded-2xl p-4">
              <iconify-icon
                icon="mdi:instagram"
                class="text-muted-foreground mr-3"
                width="20"
              ></iconify-icon
              ><input
                type="text"
                value="https://instagram.com/reels/C3x9Lp-v..."
                class="flex-1 bg-transparent border-none p-0 text-sm font-medium focus:ring-0 outline-none text-muted-foreground truncate"
              />
            </div>
          </div>
          <div class="space-y-2">
            <label class="text-xs font-bold uppercase tracking-wider text-muted-foreground px-1"
              >Personal Note</label
            ><textarea
              rows="4"
              class="w-full bg-secondary border-none rounded-2xl px-5 py-4 text-sm font-medium focus:ring-2 focus:ring-primary outline-none resize-none leading-relaxed"
              placeholder="Tell your followers why you love this place..."
            >
Best oat milk latte in Silver Lake. The patio vibe is unmatched for weekend morning work sessions. ☕️🌿</textarea
            >
          </div>
        </section>
        <section class="bg-secondary/50 rounded-3xl p-5 flex items-center justify-between">
          <div>
            <p class="font-bold text-sm">Publicly Visible</p>
            <p class="text-[10px] text-muted-foreground mt-0.5">
              Allow followers to see this mention on your profile
            </p>
          </div>
          <button class="w-12 h-6 bg-primary rounded-full relative p-1 transition-colors">
            <div class="absolute right-1 top-1 w-4 h-4 bg-white rounded-full shadow-sm"></div>
          </button>
        </section>
        <button
          class="w-full py-4 text-destructive font-bold text-sm hover:bg-destructive/10 rounded-2xl transition-colors"
        >
          Delete this mention
        </button>
      </main>
    </div>
  </body>
</html>
