<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SearchExplore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <style type="text/tailwindcss">
      @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-accent-foreground: var(--accent-foreground);
        --color-destructive: var(--destructive);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-popover: var(--popover);
        --color-popover-foreground: var(--popover-foreground);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --color-chart-1: var(--chart-1);
        --color-chart-2: var(--chart-2);
        --color-chart-3: var(--chart-3);
        --color-chart-4: var(--chart-4);
        --color-chart-5: var(--chart-5);

        --font-font-sans: var(--font-sans);
        --font-font-heading: var(--font-heading);
        --font-font-serif: var(--font-serif);
        --font-font-mono: var(--font-mono);

        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);
      }

      :root {
          --background: #FFFFFF;
        --foreground: #0F172A;
        --primary: #ff6b35;
        --primary-foreground: #FFFFFF;
        --secondary: #F1F5F9;
        --secondary-foreground: #0F172A;
        --muted: #F8FAFC;
        --muted-foreground: #64748B;
        --accent: #F1F5F9;
        --accent-foreground: #0F172A;
        --destructive: #EF4444;
        --card: #FFFFFF;
        --card-foreground: #0F172A;
        --popover: #FFFFFF;
        --popover-foreground: #0F172A;
        --border: #E2E8F0;
        --input: #F1F5F9;
        --ring: #FF5A5F;
        --chart-1: #FF5A5F;
        --chart-2: #3B82F6;
        --chart-3: #10B981;
        --chart-4: #F59E0B;
        --chart-5: #8B5CF6;

        --font-sans: "Plus Jakarta Sans";
        --font-heading: "Plus Jakarta Sans";
        --font-serif: "Playfair Display";
        --font-mono: "JetBrains Mono";

        --radius: 1rem;
      }

      /* Prevent layout shift for icons without explicit dimensions */
      iconify-icon:not([width]):not([height]) {
        display: inline-block;
        width: 1em;
        height: 1em;
      }

      /* Hide scrollbars */
      *,
      *::before,
      *::after {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      *::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="min-h-screen bg-background text-foreground pb-24 font-sans">
      <header
        class="px-6 pt-12 pb-6 sticky top-0 bg-background/95 backdrop-blur-xl z-40 border-b border-border"
      >
        <div class="relative group">
          <iconify-icon
            icon="solar:magnifer-linear"
            class="absolute left-5 top-1/2 -translate-y-1/2 text-muted-foreground group-focus-within:text-primary transition-colors"
            width="20"
          ></iconify-icon
          ><input
            type="text"
            placeholder="What are you feeling? (e.g. date night...)"
            class="w-full bg-secondary border-none rounded-2xl pl-12 pr-5 py-4 text-sm font-medium focus:ring-2 focus:ring-primary outline-none transition-all placeholder:text-muted-foreground/60 shadow-sm"
          />
        </div>
      </header>
      <main class="px-6 space-y-10 pt-6">
        <section class="space-y-4">
          <div class="flex items-center justify-between">
            <h2 class="font-heading font-black text-lg tracking-tight uppercase italic">
              Pick a Vibe
            </h2>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <button
              class="bg-rose-50 border border-rose-100 p-5 rounded-[2.5rem] flex flex-col items-center justify-center gap-3 active:scale-95 transition-all"
              onclick="location.href=&#39;#Search Result&#39;"
            >
              <iconify-icon icon="solar:heart-bold" class="text-rose-500" width="36"></iconify-icon
              ><span class="text-[11px] font-black uppercase tracking-widest text-rose-950"
                >Date Night</span
              ></button
            ><button
              class="bg-blue-50 border border-blue-100 p-5 rounded-[2.5rem] flex flex-col items-center justify-center gap-3 active:scale-95 transition-all"
              onclick="location.href=&#39;#Search Result&#39;"
            >
              <iconify-icon
                icon="solar:users-group-two-rounded-bold"
                class="text-blue-500"
                width="36"
              ></iconify-icon
              ><span class="text-[11px] font-black uppercase tracking-widest text-blue-950"
                >Friends</span
              ></button
            ><button
              class="bg-emerald-50 border border-emerald-100 p-5 rounded-[2.5rem] flex flex-col items-center justify-center gap-3 active:scale-95 transition-all"
              onclick="location.href=&#39;#Search Result&#39;"
            >
              <iconify-icon
                icon="solar:wallet-bold"
                class="text-emerald-600"
                width="36"
              ></iconify-icon
              ><span class="text-[11px] font-black uppercase tracking-widest text-emerald-950"
                >Cheap Eats</span
              ></button
            ><button
              class="bg-slate-50 border border-slate-200 p-5 rounded-[2.5rem] flex flex-col items-center justify-center gap-3 active:scale-95 transition-all"
              onclick="location.href=&#39;#Search Result&#39;"
            >
              <iconify-icon icon="mdi:briefcase" class="text-slate-600" width="36"></iconify-icon
              ><span class="text-[11px] font-black uppercase tracking-widest text-slate-950"
                >Corporate</span
              >
            </button>
          </div>
        </section>
        <section class="space-y-4">
          <div class="flex items-center justify-between">
            <h2 class="font-heading font-bold text-lg tracking-tight uppercase italic">
              Popular Cities
            </h2>
            <button class="text-xs font-bold text-primary hover:underline transition-all">
              See All
            </button>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div class="relative h-24 rounded-3xl overflow-hidden group cursor-pointer">
              <img
                src="https://ggrhecslgdflloszjkwl.supabase.co/storage/v1/object/public/generation-assets/placeholder/landscape.png"
                alt="Los Angeles"
                class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500"
              />
              <div class="absolute inset-0 bg-black/40 flex items-center justify-center">
                <span class="text-white font-bold text-sm tracking-wide">Los Angeles</span>
              </div>
            </div>
            <div class="relative h-24 rounded-3xl overflow-hidden group cursor-pointer">
              <img
                src="https://ggrhecslgdflloszjkwl.supabase.co/storage/v1/object/public/generation-assets/placeholder/landscape.png"
                alt="New York"
                class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500"
              />
              <div class="absolute inset-0 bg-black/40 flex items-center justify-center">
                <span class="text-white font-bold text-sm tracking-wide">New York</span>
              </div>
            </div>
          </div>
        </section>
      </main>
      <nav
        class="fixed bottom-0 left-0 w-full bg-background/95 backdrop-blur-xl border-t border-border px-6 py-3 flex items-center justify-between z-50 safe-area-bottom"
      >
        <button
          class="flex flex-col items-center gap-1 text-muted-foreground hover:text-foreground w-16 transition-colors"
          onclick="location.href=&#39;#N1Q2qxG9BHO&#39;"
        >
          <iconify-icon icon="solar:compass-linear" width="24" height="24"></iconify-icon
          ><span class="text-[10px] font-medium tracking-wide">Discover</span></button
        ><button
          class="flex flex-col items-center gap-1 text-muted-foreground hover:text-foreground w-16 transition-colors"
          onclick="location.href=&#39;#HR9qNYKPac7&#39;"
        >
          <iconify-icon icon="solar:map-linear" width="24" height="24"></iconify-icon
          ><span class="text-[10px] font-medium tracking-wide">Map</span></button
        ><button
          class="flex flex-col items-center gap-1 text-muted-foreground hover:text-foreground w-16 transition-colors"
          onclick="location.href=&#39;#dlxPwjvXOsT&#39;"
        >
          <iconify-icon icon="solar:bookmark-linear" width="24" height="24"></iconify-icon
          ><span class="text-[10px] font-medium tracking-wide">Saved</span></button
        ><button
          class="flex flex-col items-center gap-1 text-muted-foreground hover:text-foreground w-16 transition-colors"
          onclick="location.href=&#39;#UP3QVIzvHzc&#39;"
        >
          <iconify-icon icon="solar:user-circle-linear" width="24" height="24"></iconify-icon
          ><span class="text-[10px] font-medium tracking-wide">Profile</span>
        </button>
      </nav>
    </div>
  </body>
</html>
