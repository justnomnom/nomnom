<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OnboardingLocation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <style type="text/tailwindcss">
      @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-accent-foreground: var(--accent-foreground);
        --color-destructive: var(--destructive);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-popover: var(--popover);
        --color-popover-foreground: var(--popover-foreground);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --color-chart-1: var(--chart-1);
        --color-chart-2: var(--chart-2);
        --color-chart-3: var(--chart-3);
        --color-chart-4: var(--chart-4);
        --color-chart-5: var(--chart-5);

        --font-font-sans: var(--font-sans);
        --font-font-heading: var(--font-heading);
        --font-font-serif: var(--font-serif);
        --font-font-mono: var(--font-mono);

        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);
      }

      :root {
          --background: #FFFFFF;
        --foreground: #0F172A;
        --primary: #ff6b35;
        --primary-foreground: #FFFFFF;
        --secondary: #F1F5F9;
        --secondary-foreground: #0F172A;
        --muted: #F8FAFC;
        --muted-foreground: #64748B;
        --accent: #F1F5F9;
        --accent-foreground: #0F172A;
        --destructive: #EF4444;
        --card: #FFFFFF;
        --card-foreground: #0F172A;
        --popover: #FFFFFF;
        --popover-foreground: #0F172A;
        --border: #E2E8F0;
        --input: #F1F5F9;
        --ring: #FF5A5F;
        --chart-1: #FF5A5F;
        --chart-2: #3B82F6;
        --chart-3: #10B981;
        --chart-4: #F59E0B;
        --chart-5: #8B5CF6;

        --font-sans: "Plus Jakarta Sans";
        --font-heading: "Plus Jakarta Sans";
        --font-serif: "Playfair Display";
        --font-mono: "JetBrains Mono";

        --radius: 1rem;
      }

      /* Prevent layout shift for icons without explicit dimensions */
      iconify-icon:not([width]):not([height]) {
        display: inline-block;
        width: 1em;
        height: 1em;
      }

      /* Hide scrollbars */
      *,
      *::before,
      *::after {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      *::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="min-h-screen bg-background flex flex-col p-6 pb-10 relative overflow-hidden">
      <div class="absolute -bottom-10 -left-10 opacity-10 -rotate-12">
        <iconify-icon icon="fluent-emoji:world-map" width="160"></iconify-icon>
      </div>
      <div class="flex items-center justify-between mb-10 relative z-10">
        <div class="flex gap-2 flex-1 mr-4">
          <div class="h-2 flex-1 bg-primary rounded-full"></div>
          <div class="h-2 flex-1 bg-primary rounded-full"></div>
          <div class="h-2 flex-1 bg-muted rounded-full"></div>
          <div class="h-2 flex-1 bg-muted rounded-full"></div>
        </div>
        <button
          class="text-xs font-black uppercase tracking-widest text-muted-foreground/60 hover:text-primary transition-colors"
          onclick="location.href=&#39;#fS5r9SK4MFY&#39;"
        >
          Skip
        </button>
      </div>
      <div class="flex-1 relative z-10">
        <div class="mb-8">
          <h1 class="text-4xl font-black font-heading mb-3 tracking-tighter">
            Where's the hunger? 📍
          </h1>
          <p class="text-muted-foreground text-lg font-medium leading-relaxed">
            Let's find the tastiest spots for your next Nom Nom session!
          </p>
        </div>
        <div class="space-y-6">
          <button
            class="w-full flex items-center gap-5 p-6 rounded-[2.5rem] border-4 border-primary bg-primary/5 text-primary transition-all shadow-xl shadow-primary/10 active:scale-95"
          >
            <div
              class="size-16 rounded-[1.5rem] bg-white flex items-center justify-center shadow-lg group-hover:scale-110 transition-transform"
            >
              <iconify-icon icon="fluent-emoji:round-pushpin" class="text-4xl"></iconify-icon>
            </div>
            <div class="text-left flex-1">
              <p class="font-black text-lg leading-tight">Use My Location</p>
              <p class="text-[9px] font-black text-primary uppercase tracking-widest mt-1">
                Best for nomnomming nearby
              </p>
            </div>
            <iconify-icon icon="solar:check-circle-bold" class="text-2xl"></iconify-icon>
          </button>
          <div>
            <p
              class="text-[10px] font-black uppercase tracking-[0.2em] text-muted-foreground/60 px-2 mb-4"
            >
              Or pick a foodie capital
            </p>
            <div class="grid grid-cols-2 gap-4">
              <button
                class="flex flex-col items-center justify-center p-6 rounded-[2.5rem] border-2 border-border bg-card hover:border-primary/50 transition-all hover:shadow-lg active:scale-95 gap-3 group"
              >
                <iconify-icon
                  icon="fluent-emoji:statue-of-liberty"
                  class="text-4xl group-hover:scale-110 transition-transform"
                ></iconify-icon
                ><span class="font-black text-sm uppercase tracking-tight">New York</span></button
              ><button
                class="flex flex-col items-center justify-center p-6 rounded-[2.5rem] border-2 border-border bg-card hover:border-primary/50 transition-all hover:shadow-lg active:scale-95 gap-3 group"
              >
                <iconify-icon
                  icon="fluent-emoji:cityscape"
                  class="text-4xl group-hover:scale-110 transition-transform"
                ></iconify-icon
                ><span class="font-black text-sm uppercase tracking-tight"
                  >Los Angeles</span
                ></button
              ><button
                class="flex flex-col items-center justify-center p-6 rounded-[2.5rem] border-2 border-border bg-card hover:border-primary/50 transition-all hover:shadow-lg active:scale-95 gap-3 group"
              >
                <iconify-icon
                  icon="fluent-emoji:tokyo-tower"
                  class="text-4xl group-hover:scale-110 transition-transform"
                ></iconify-icon
                ><span class="font-black text-sm uppercase tracking-tight">Tokyo</span></button
              ><button
                class="flex flex-col items-center justify-center p-6 rounded-[2.5rem] border-2 border-border bg-card hover:border-primary/50 transition-all hover:shadow-lg active:scale-95 gap-3 group"
              >
                <iconify-icon
                  icon="mdi:eiffel-tower"
                  class="text-4xl group-hover:scale-110 transition-transform"
                ></iconify-icon
                ><span class="font-black text-sm uppercase tracking-tight">Paris</span>
              </button>
            </div>
          </div>
        </div>
      </div>
      <div class="mt-8 relative z-10">
        <button
          class="w-full bg-foreground text-background py-5 rounded-[2rem] font-black text-xl shadow-2xl flex items-center justify-center gap-2 active:scale-95 transition-all hover:gap-4"
          onclick="location.href=&#39;#fS5r9SK4MFY&#39;"
        >
          Almost There!<iconify-icon icon="solar:arrow-right-bold" class="text-2xl"></iconify-icon>
        </button>
      </div>
    </div>
  </body>
</html>
